[project]
name = "layer-fraud-mvp"
version = "0.1.0"
description = "Phase 3 scaffold for the Layer fraud detection hackathon MVP."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "pytest>=8.0",
  "uvicorn>=0.27",
  "xgboost>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

